<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d1521">
<title>Log in · JHive</title>
<style>
:root{color-scheme:dark;--bg:#0d1521;--panel:#121d2b;--line:#253448;--text:#eaf0f8;--muted:#91a0b2;--accent:#39c7e5;--red:#ff7b82;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px var(--font)}.shell{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr)}aside{background:#0f1927;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column}.brand{padding:0 6px 31px}.brand img{display:block;width:100%;max-height:64px;height:auto;object-fit:contain;object-position:left center}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#718096;padding:0 12px;margin:12px 0 8px}.nav{display:grid;gap:4px}.nav-item{display:flex;align-items:center;gap:12px;color:#8798ad;padding:11px 12px;border-radius:8px;font-size:13px}.nav-item .icon{width:18px;text-align:center}.nav-item.disabled{opacity:.5}.nav-item.active{background:#17283a;color:var(--accent)}.rail-note{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;color:#8190a2;font-size:10px}.main{min-width:0;padding:25px clamp(18px,3vw,42px)}.topbar{height:35px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.topbar b{color:#d7e0eb;font-weight:550}.paper{border:1px solid #244353;background:#122633;color:var(--accent);padding:7px 10px;border-radius:999px;font-size:9px;letter-spacing:.4px}.content{min-height:calc(100vh - 85px);display:grid;place-items:center}.login{width:min(100%,390px);padding:31px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 60px #0003}.login-logo{display:none}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:700;margin-bottom:8px}h1{font-size:23px;letter-spacing:-.5px;margin:0}.intro{color:var(--muted);font-size:12px;margin:9px 0 23px}label{display:block;color:#c3cfdd;font-size:11px;margin:15px 0 7px}input{width:100%;padding:11px 12px;border-radius:7px;border:1px solid #314258;background:#0d1724;color:var(--text);font:13px var(--font);outline:none}input:focus{border-color:var(--accent)}.submit{width:100%;border:0;border-radius:7px;background:var(--accent);color:#071a24;font-weight:700;padding:11px;margin-top:15px;cursor:pointer}.submit:disabled{opacity:.65}.toggle{display:block;background:none;border:0;color:var(--accent);cursor:pointer;margin:17px auto 0;font-size:11px}.note{border-top:1px solid var(--line);padding-top:13px;text-align:center;color:var(--muted);font-size:10px;margin:18px 0 0}.error{min-height:17px;color:var(--red);font-size:11px;margin-top:9px}@media(max-width:700px){.shell{grid-template-columns:64px minmax(0,1fr)}aside{padding:20px 8px}.brand{padding:0 5px 26px}.brand img{width:44px;max-height:40px;object-fit:cover;object-position:left}.nav-label{font-size:8px;padding:0 6px}.nav-item{justify-content:center;padding:10px 4px;font-size:0}.nav-item .icon{font-size:15px}.rail-note{font-size:0;padding:14px 0 0}.main{padding:18px 12px}.login{padding:23px}.content{min-height:calc(100vh - 75px)}}
</style>
</head>
<body><div class="shell"><aside><div class="brand"><img src="/jhive-logo.png" alt="J-Hive"></div><div class="nav-label">Workspace</div><nav class="nav"><div class="nav-item disabled"><span class="icon">▦</span>Overview</div><div class="nav-item disabled"><span class="icon">◉</span>Portfolio</div><div class="nav-item disabled"><span class="icon">☆</span>Watchlist</div><div class="nav-item disabled"><span class="icon">⌁</span>Strategies</div></nav><div class="nav-label">Account</div><nav class="nav"><div class="nav-item disabled"><span class="icon">⚙</span>Settings</div><div class="nav-item active"><span class="icon">↪</span>Log in</div></nav><div class="rail-note">Paper account</div></aside><main class="main"><header class="topbar"><span>Workspace&nbsp; / &nbsp;<b>Account</b></span><span class="paper">PAPER ACCOUNT</span></header><div class="content"><section class="login"><div class="eyebrow">Trading workspace</div><h1 id="title">Log in to JHive</h1><p class="intro">Use your JHive account to continue.</p><form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="At least 12 characters"><div class="error" id="error" role="alert"></div><button class="submit" id="submit" type="submit">Log in</button></form><button class="toggle" id="toggle" type="button">New to JHive? Create an account</button><p class="note">Your account is stored on this computer.</p></section></div></main></div>
<script>
let register=false;const title=document.getElementById("title"),button=document.getElementById("submit"),toggle=document.getElementById("toggle"),password=document.getElementById("password"),error=document.getElementById("error");toggle.addEventListener("click",()=>{register=!register;title.textContent=register?"Create your account":"Log in to JHive";button.textContent=register?"Create account":"Log in";toggle.textContent=register?"Already have an account? Log in":"New to JHive? Create an account";password.autocomplete=register?"new-password":"current-password";password.minLength=register?12:0;error.textContent=""});document.getElementById("form").addEventListener("submit",async event=>{event.preventDefault();error.textContent="";button.disabled=true;try{const response=await fetch(register?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:document.getElementById("email").value,password:password.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||"Unable to sign in.");window.location.assign("/dashboard")}catch(problem){error.textContent=problem.message}finally{button.disabled=false}});
</script></body></html>
